$('#h1').innerHTML=[['Okay, so',''],['where are we going?','y']].map(p=>p[0].split(' ').map(w=>`<span class="${p[1]}">${w}</span>`).join(' ')).join('<br>');$$('#h1 span').forEach((e,i)=>e.style.setProperty('--i',i));
$('#pl').innerHTML=PL.map(p=>`<button class="chip" data-pl="${p[0]}" aria-pressed="false">${p[1]}</button>`).join('')+'<button class="chip op" data-on aria-pressed="false"><i></i>open now</button>';
$('#lz').innerHTML='<span class="rk">ranked by</span>'+['overall',...L].map((l,i)=>`<button class="chip" data-o="${i-1}" aria-pressed="false">${l}</button>`).join('');
$('#bn').innerHTML=BANDS.map((b,i)=>`<button class="bb b${i+1}" data-bf="${i}" aria-pressed="false"><b>0</b><span>${b[2]}</span></button>`).join('');
/* filter */
const fl=ib=>C.filter(c=>(!st.pl||c.p.includes(st.pl))&&(!st.on||op(c))&&(ib||st.bf<0||bi(c.sc)==st.bf)&&(!st.q||(c.n+' '+c.a+' '+c.tg+' '+c.ord.join(' ')).toLowerCase().includes(st.q)));
const val=c=>st.sk<0?c.sc:c.s[st.sk];
/* templates */
const open=c=>`<i class="od ${op(c)?'on':''}"></i>${op(c)?'open · ':'closed · '}${c.hr}`;
const card=(c,i)=>{const lb=st.sk<0?'overall':L[st.sk],sv=S.includes(c.id);return `<article class="cd" data-id="${c.id}" data-href="${href(c)}"><div class="gal">${c.im.slice(0,4).map((m,j)=>`<img src="${IM[m]}" alt="${nm(c)}, photo ${j+1}" ${j?'loading="lazy"':''} style="object-position:${POS[m]||'center'}" draggable="false">`).join('')}</div><div class="scr"></div><span class="tg"><b>#${i+1}</b>${c.tg}</span><b class="sc"><small>${lb}</small>${f1(val(c))}</b><span class="dots">${c.im.slice(0,4).map((_,j)=>`<i class="${j?'':'on'}"></i>`).join('')}</span><button class="ar l" data-g="-1" aria-label="previous photo">‹</button><button class="ar r" data-g="1" aria-label="next photo">›</button>
<div class="in"><h3><a href="${href(c)}">${c.n}</a></h3><p class="mta">${c.a} · ${open(c)}</p><p class="why ${st.sk<0?'':'k'}">${st.sk<0?c.vd:c.tk[st.sk]}</p><p class="mnx"><b>maybe not</b>${c.mns}</p>${c.nt?`<p class="nt">${c.nt}</p>`:''}<div class="p5">${L.map((l,j)=>`<span class="${st.sk==j?'on':''}"><b>${f1(c.s[j])}</b>${l}</span>`).join('')}</div>
<div class="ac"><a class="mi y" href="${href(c)}">review</a><a class="mi" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nm(c)+' '+c.a+' Ahmedabad')}">directions</a><a class="mi" href="tel:${c.ph.replace(/\s/g,'').replace(/^0/,'+91')}">call</a></div></div><button class="sv" data-s="${c.id}" aria-pressed="${sv}" aria-label="save ${nm(c)}">${sv?'♥':'♡'}</button></article>`};
const row=(c,i)=>{const sv=S.includes(c.id);return `<article class="rw" data-id="${c.id}" data-href="${href(c)}"><b class="rn">${i+1}</b><img src="${TH[c.im[0]]}" alt="" style="object-position:${POS[c.im[0]]||'center'}"><div class="rb"><h3><a href="${href(c)}">${c.n}</a></h3><small>${c.a} · ${open(c)}</small><div class="mb" aria-hidden="true">${c.s.map((v,j)=>`<i class="${st.sk==j?'on':''}" style="height:${v*2.2}px;animation-delay:${j*50}ms"></i>`).join('')}</div></div><b class="bg">${f1(val(c))}</b><button class="sv2" data-s="${c.id}" aria-pressed="${sv}" aria-label="save ${nm(c)}">${sv?'♥':'♡'}</button></article>`};
/* paint with FLIP re-rank */
function paint(){const o={};$$('#gr [data-id]').forEach(e=>o[e.dataset.id]=e.getBoundingClientRect());
const l=fl().sort((a,b)=>val(b)-val(a)||b.sc-a.sc),n=l.length,cp=st.v=='cp';
$('#gr').className='gr'+(cp?' cp':'');$('#gr').innerHTML=n?l.map(cp?row:card).join(''):`<div class="em"><div class="script">hmm.</div><h3>Nothing fits yet.</h3><p>We’re still out there eating. Loosen a filter, or tell us where to go next.</p><button class="pill" data-clr>clear filters</button></div>`;
$$('[data-pl]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pl==st.pl));$$('[data-o]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.o==st.sk));$$('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==st.v));$('[data-on]').setAttribute('aria-pressed',!!st.on);
const all=fl(1);$$('.bb').forEach((b,i)=>{const k=all.filter(c=>bi(c.sc)==i).length;b.querySelector('b').textContent=k;b.style.flexGrow=Math.max(k,.5);b.dataset.z=k?'':1;b.setAttribute('aria-pressed',st.bf==i)});
const lb=PL.find(p=>p[0]==st.pl)[1],f=st.pl||st.on||st.bf>=0||st.q||st.sk>=0;
$('#ct').textContent=`${n} cafe${n==1?'':'s'}`+(st.pl?' · '+lb:'')+(st.on?' · open now':'')+(st.bf>=0?' · '+BANDS[st.bf][2]:'')+(st.sk>=0?' · by '+L[st.sk]:'')+(st.q?' · “'+st.q+'”':'');$('#cl').hidden=!(st.pl||st.on||st.bf>=0||st.q);
$('#ld').textContent=`${C.length} cafes, scored by people who paid for their own coffee. Tell us the plan, we’ll sort the rest.`;
const p=new URLSearchParams();if(st.pl)p.set('plan',st.pl);if(st.sk>=0)p.set('by',st.sk);if(st.q)p.set('q',st.q);try{history.replaceState(null,'',p.toString()?'?'+p:location.pathname)}catch(e){}
if(!rm)$$('#gr [data-id]').forEach((e,i)=>{const a=o[e.dataset.id],b=e.getBoundingClientRect();if(a){if(Math.abs(a.top-b.top)>1||Math.abs(a.left-b.left)>1)e.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px)`},{transform:'none'}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'})}else e.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:550,delay:Math.min(i,6)*70,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'})})}
/* shortlist + compare */
const rs=()=>{const l=C.filter(c=>S.includes(c.id)),k=l.slice(0,3);$('#sl').innerHTML=l.length?l.map(c=>`<div class="si"><div><b>${c.n}</b><small>${c.a} · ${f1(c.sc)}</small></div><button data-rm="${c.id}" aria-label="remove ${nm(c)}">remove</button></div>`).join(''):'<p class="sub" style="margin-top:10px">Nothing yet. Tap ♡ on a cafe and it lands here. Save two and we’ll compare them.</p>';
$('#cmp').innerHTML=k.length>1?`<h4 class="ch">Head to head${l.length>3?' · first 3':''}</h4>`+L.map((x,i)=>{const m=Math.max(...k.map(c=>c.s[i]));return `<div class="cr"><span>${x}</span>${k.map(c=>`<div class="cb"><i class="${c.s[i]==m?'w':''}" style="--w:${c.s[i]*10}%"></i><em>${nm(c)}</em><b>${f1(c.s[i])}</b></div>`).join('')}</div>`}).join(''):'';
const w=$('#sw');w.style.display=l.length?'':'none';w.href='https://wa.me/?text='+encodeURIComponent('Cafe shortlist:\n'+l.map(c=>c.n+' ('+c.a+') '+f1(c.sc)+'/10').join('\n')+'\n'+location.origin+location.pathname.replace(/[^/]*$/,'list.html'))};
const shd=$('#shd'),oS=o=>{if(o)rs();shd.classList.toggle('open',!!o);document.body.style.overflow=o?'hidden':''};addEventListener('keydown',e=>{if(e.key=='Escape')oS(0)});
/* events */
const clr=()=>{st.pl='';st.on=0;st.bf=-1;st.q='';$('#q').value=''};
document.addEventListener('click',e=>{const t=e.target.closest('[data-pl],[data-on],[data-o],[data-bf],[data-v],[data-g],[data-s],[data-sh],[data-x],[data-rm],[data-clr]');navigator.vibrate&&t&&navigator.vibrate(6);
if(!t){const c=e.target.closest('[data-href]');if(c&&!e.target.closest('a,button'))location.href=c.dataset.href;return}
const d=t.dataset;
if(d.pl!==undefined){st.pl=d.pl;paint()}else if(d.on!==undefined){st.on=st.on?0:1;paint()}else if(d.o!==undefined){st.sk=+d.o;paint()}
else if(d.bf!==undefined){st.bf=st.bf==+d.bf?-1:+d.bf;paint();if(!rm)$('#list').scrollIntoView({behavior:'smooth'})}
else if(d.v){st.v=d.v;paint()}else if(d.clr!==undefined){clr();paint()}
else if(d.g!==undefined){const g=t.closest('.cd').querySelector('.gal');g.scrollBy({left:+d.g*g.clientWidth,behavior:'smooth'})}
else if(d.s){const i=S.indexOf(d.s);i<0?S.push(d.s):S.splice(i,1);$$(`[data-s="${d.s}"]`).forEach(b=>{b.setAttribute('aria-pressed',i<0);b.textContent=i<0?'♥':'♡'});save();toast(i<0?'saved for later':'removed')}
else if(d.sh!==undefined)oS(1);else if(d.x!==undefined)oS(0);else if(d.rm){S=S.filter(x=>x!=d.rm);save();$$(`[data-s="${d.rm}"]`).forEach(b=>{b.setAttribute('aria-pressed',false);b.textContent='♡'});rs()}});
$('#q').addEventListener('input',e=>{st.q=e.target.value.trim().toLowerCase();paint()});
document.addEventListener('scroll',e=>{const g=e.target;if(!g.classList||!g.classList.contains('gal'))return;const i=Math.round(g.scrollLeft/g.clientWidth);g.parentNode.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',i==j))},true);
$('#sf').addEventListener('submit',e=>{e.preventDefault();const v=$('#si').value.trim();if(!v)return toast('type a cafe name first');location.href='suggest.html?q='+encodeURIComponent(v)});
/* scroll: header, progress, dock, hide-on-scroll-down controls */
const hd=$('#hd'),pg=$('#pg'),dk=$('#dock'),ch=$('#ch');let ly=0,tk=0;
addEventListener('scroll',()=>{if(tk)return;tk=1;requestAnimationFrame(()=>{tk=0;const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;pg.style.transform=`scaleX(${h>0?y/h:0})`;hd.classList.toggle('s',y>300);dk.classList.toggle('show',y>400);ch.classList.toggle('h',y>520&&y>ly+4);if(y<ly-4||y<520)ch.classList.remove('h');ly=y})},{passive:true});
save();paint();
</script></body></html>
