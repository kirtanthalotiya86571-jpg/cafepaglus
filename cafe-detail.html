<script>
const IM=SITE.IM,TH=SITE.TH,POS={kfire:'58% 40%',bar:'center 70%',table:'center 60%'};

const $=s=>document.querySelector(s);let S=[];try{S=JSON.parse(localStorage.getItem('cp')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('cp',JSON.stringify(S))}catch(e){}};

function render(){
const c=cur=C.find(x=>x.id==(window.CAFE_ID||location.hash.slice(1)))||C[0],w=(c.rd.replace(/<[^>]+>/g,'')+' '+Object.values(c.tk).join(' ')+' '+c.mn).split(' ').length,secs=Math.round(w/3.3),ks=Object.keys(c.tk).map(Number),COL=[['#E9F056','#0B0B0B'],['#D7EFFF','#0B0B0B'],['#AEB8A0','#0B0B0B'],['#351E28','#fff']];

}
function wrap(x,t,px,py,w,lh){let l='';for(const o of t.split(' ')){const n=l?l+' '+o:o;if(x.measureText(n).width>w&&l){x.fillText(l,px,py);py+=lh;l=o}else l=n}x.fillText(l,px,py);return py+lh}

cv.toBlob(async b=>{const f=new File([b],'cafepaglus.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast('Story cards can be shared from a phone')}catch(e){}})}catch(e){toast('Couldn’t make the card')}}
